name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name MUST stay `test` — GitHub branch protection required checks
  # target this exact name (check run: "test"). Renaming silently unhooks
  # "Require status checks to pass before merging".
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: safartrip_test
          MYSQL_USER: safar
          MYSQL_PASSWORD: safar
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DATABASE_URL: mysql://safar:safar@127.0.0.1:3307/safartrip_test
      DATABASE_URL: mysql://safar:safar@127.0.0.1:3307/safartrip_test
      JWT_ACCESS_SECRET: ci_access_secret_for_tests_only
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests_only
      RESET_TEST_DB_MODE: migrate
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match production Contabo Node (22.x) and local develop machines.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Production gate: green CI means this SHA is deployable.
      # Failure must fail the job (no continue-on-error). Restored 2026-07-30
      # after 5f5de3a stripped it for runner memory; keep BUILD_ID assert.
      - name: Production build
        run: |
          set -euo pipefail
          npm run build
          test -f .next/BUILD_ID

      # Lint still intentionally OUT of the blocking sequence (removed 2026-07-29
      # in 5f5de3a for standalone/ noise). eslint.config.mjs now ignores
      # standalone/** — re-adding Lint as a required step needs Rustam's OK
      # after a green `npm run lint` on main (do not silently re-enable).

      # Empty CI MySQL must apply history from 0_init (never db push here —
      # that reintroduces migrate/schema drift).
      - name: Apply migrations to test DB
        run: npx prisma migrate deploy

      - name: Vitest
        run: npx vitest run

      # No deploy job — production deploy is server-side via scripts/deploy-safe.sh
