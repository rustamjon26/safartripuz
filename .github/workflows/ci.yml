name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: safartrip_test
          MYSQL_USER: safar
          MYSQL_PASSWORD: safar
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DATABASE_URL: mysql://safar:safar@127.0.0.1:3307/safartrip_test
      DATABASE_URL: mysql://safar:safar@127.0.0.1:3307/safartrip_test
      JWT_ACCESS_SECRET: ci_access_secret_for_tests_only
      JWT_REFRESH_SECRET: ci_refresh_secret_for_tests_only
      RESET_TEST_DB_MODE: migrate
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match production Contabo Node (22.x) and local develop machines.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      # Lint intentionally removed 2026-07-29 (standalone/ noise + separate eslint ignore PR).
      # Restore after eslint.config.mjs ignores standalone/ and the suite is green again.

      # Empty CI MySQL must apply history from 0_init (never db push here —
      # that reintroduces migrate/schema drift).
      - name: Apply migrations to test DB
        run: npx prisma migrate deploy

      - name: Vitest
        run: npx vitest run
